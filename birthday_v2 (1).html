<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --magenta:#e040a0; --magenta-glow:#ff69c8; --magenta-dim:rgba(224,64,160,0.25);
  --deep:#050408; --glass-bg:rgba(12,8,20,0.55); --glass-border:rgba(224,64,160,0.35);
  --white:#f0eaf8; --ff-display:'Cormorant Garamond',serif; --ff-body:'Jost',sans-serif;
}
html,body { width:100%; height:100%; background:var(--deep); color:var(--white); font-family:var(--ff-body); overflow:hidden; -webkit-font-smoothing:antialiased; }
#particle-canvas { position:fixed; inset:0; z-index:5; pointer-events:none; }
.scene { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 1.4s ease; z-index:10; }
.scene.active { opacity:1; pointer-events:all; }

/* ── INTRO ── */
#scene-intro { flex-direction:column; background:var(--deep); z-index:10; }
#scene-intro .bg-image {
  position:absolute; inset:0;
  /* ▼ REPLACE with your fireworks image e.g. url('fireworks-bg.jpg') ▼ */
  background:url('https://images.unsplash.com/photo-1467810563316-b5476525c0f9?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
  opacity:0.32; filter:saturate(1.5) hue-rotate(-10deg);
}
#scene-intro .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center,transparent 25%,var(--deep) 80%); }
#scene-intro .content { position:relative; z-index:2; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1.4rem; animation:introReveal 2s ease forwards; animation-delay:0.4s; opacity:0; }
@keyframes introReveal { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
.intro-eyebrow { font-family:var(--ff-body); font-weight:200; font-size:clamp(0.6rem,2vw,0.82rem); letter-spacing:0.42em; text-transform:uppercase; color:var(--magenta-glow); opacity:0.85; }
.intro-title { font-family:var(--ff-display); font-weight:300; font-size:clamp(3rem,11vw,7.5rem); line-height:1.04; color:var(--white); text-shadow:0 0 80px var(--magenta-dim),0 0 140px rgba(224,64,160,.1); }
.intro-title em { font-style:italic; color:var(--magenta-glow); text-shadow:0 0 35px rgba(255,105,200,.8),0 0 90px rgba(255,105,200,.3); }
.intro-sub { font-family:var(--ff-body); font-weight:200; font-size:clamp(0.68rem,2vw,0.9rem); letter-spacing:0.22em; text-transform:uppercase; opacity:0.45; margin-top:0.3rem; }
.btn-start { margin-top:1.8rem; padding:0.9em 3em; background:transparent; border:1px solid var(--glass-border); border-radius:2px; color:var(--white); font-family:var(--ff-body); font-weight:300; font-size:clamp(0.68rem,2vw,0.86rem); letter-spacing:0.32em; text-transform:uppercase; cursor:pointer; position:relative; overflow:hidden; transition:border-color .4s,color .4s,box-shadow .4s; }
.btn-start::before { content:''; position:absolute; inset:0; background:var(--magenta-dim); transform:scaleX(0); transform-origin:left; transition:transform .4s ease; }
.btn-start:hover { border-color:var(--magenta-glow); color:var(--magenta-glow); box-shadow:0 0 24px var(--magenta-dim); }
.btn-start:hover::before { transform:scaleX(1); }
.btn-start span { position:relative; z-index:1; }
.btn-start::after { content:''; position:absolute; inset:-4px; border:1px solid rgba(224,64,160,.18); border-radius:3px; animation:pulsRing 2.6s ease-in-out infinite; }
@keyframes pulsRing { 0%,100%{opacity:.12;transform:scale(1)} 50%{opacity:.55;transform:scale(1.04)} }

/* ── GLOBE SCENE ── */
#scene-globe { background:#000; z-index:9; perspective:1000px; }
#globe-container {
  position:relative; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  transform-style:preserve-3d;
}
#globe-stage {
  position:relative;
  width:min(70vw,70vh);
  height:min(70vw,70vh);
  transform-style:preserve-3d;
}

/* each photo card on the globe */
.globe-card {
  position:absolute;
  width:100%; height:100%;
  border-radius:8px;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
  transition:none;
}
.globe-card img {
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  border-radius:8px;
  filter:brightness(0.35) saturate(0.6);
  transition:filter 1s ease, transform 1s ease;
}
.globe-card.active img {
  filter:brightness(1) saturate(1.1);
}
.globe-card.prev img {
  filter:brightness(0.15) saturate(0.3);
}

/* neon ring around active card */
.globe-card.active::after {
  content:'';
  position:absolute; inset:-2px;
  border-radius:10px;
  border:1px solid rgba(224,64,160,0.5);
  box-shadow:0 0 30px rgba(224,64,160,0.2), inset 0 0 30px rgba(224,64,160,0.05);
  pointer-events:none;
  animation:ringPulse 2s ease-in-out infinite;
}
@keyframes ringPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Vignette overlay on globe scene */
#scene-globe::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  z-index:2; pointer-events:none;
}

/* Progress dots */
#globe-dots {
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:20;
}
.dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,0.25);
  transition:all 0.4s ease;
}
.dot.active { background:var(--magenta-glow); box-shadow:0 0 8px var(--magenta-glow); transform:scale(1.4); }

/* ── ENDING ── */
#scene-ending { flex-direction:column; z-index:11; }
#fireworks-canvas { position:absolute; inset:0; z-index:0; }
#scene-ending .bg-ending {
  position:absolute; inset:0;
  /* ▼ REPLACE with your fireworks image ▼ */
  background:url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
  opacity:0.18; filter:saturate(1.7);
}

/* ── CARD ── */
.message-card { position:relative; z-index:3; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:4px; padding:clamp(2rem,6vw,3.8rem) clamp(2rem,7vw,5rem); max-width:min(700px,90vw); text-align:center; backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); box-shadow:0 0 70px rgba(224,64,160,.22),0 0 140px rgba(224,64,160,.09),inset 0 0 50px rgba(224,64,160,.05); opacity:0; transform:scale(0.92); animation:cardEntrance 1.5s cubic-bezier(.16,1,.3,1) forwards; animation-delay:0.9s; }
@keyframes cardEntrance { from{opacity:0;transform:scale(.92) translateY(22px)} to{opacity:1;transform:scale(1) translateY(0)} }
.message-card::before,.message-card::after { content:''; position:absolute; top:14%; bottom:14%; width:1px; background:linear-gradient(to bottom,transparent,var(--magenta),transparent); opacity:0.45; }
.message-card::before { left:0; } .message-card::after { right:0; }
.card-eyebrow { font-family:var(--ff-body); font-weight:200; font-size:clamp(.52rem,1.7vw,.7rem); letter-spacing:.44em; text-transform:uppercase; color:var(--magenta-glow); margin-bottom:1.5rem; opacity:.82; }
.card-title { font-family:var(--ff-display); font-weight:300; font-size:clamp(2rem,6vw,4rem); line-height:1.1; color:var(--white); text-shadow:0 0 45px var(--magenta-dim); margin-bottom:1.6rem; }
.card-title em { font-style:italic; color:var(--magenta-glow); }
.card-divider { width:55px; height:1px; background:linear-gradient(to right,transparent,var(--magenta),transparent); margin:0 auto 1.7rem; }
.card-message { font-family:var(--ff-body); font-weight:200; font-size:clamp(.82rem,2.4vw,1.02rem); line-height:1.9; color:rgba(240,234,248,.76); letter-spacing:.03em; margin-bottom:.9rem; }
.card-emoji { font-size:clamp(1.4rem,4vw,2rem); display:block; margin-top:.9rem; animation:floatEmoji 2.6s ease-in-out infinite; }
@keyframes floatEmoji { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

/* progress bar */
#progress-bar { position:fixed; bottom:0; left:0; height:2px; width:0%; background:linear-gradient(to right,var(--magenta-dim),var(--magenta-glow),var(--magenta-dim)); z-index:100; transition:width .25s linear; box-shadow:0 0 12px var(--magenta); opacity:0; }
body::after { content:''; position:fixed; top:0; left:0; right:0; height:1px; background:linear-gradient(to right,transparent,var(--magenta-glow),transparent); opacity:0.3; z-index:999; pointer-events:none; }
#music-btn { display:none; position:fixed; bottom:22px; right:22px; padding:0.5em 1.3em; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:20px; color:var(--magenta-glow); font-family:var(--ff-body); font-weight:300; font-size:0.74rem; letter-spacing:0.15em; cursor:pointer; z-index:200; backdrop-filter:blur(10px); }
@media(max-width:480px) { .intro-title{letter-spacing:.01em} .message-card{padding:2rem 1.6rem} }
</style>
</head>
<body>

<!-- ▼▼▼ REPLACE src with your music file ▼▼▼ -->
<audio id="bg-music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="music-btn" onclick="retryMusic()">🎵 Tap to play music</button>
<canvas id="particle-canvas"></canvas>
<div id="progress-bar"></div>

<!-- SCENE 1 — INTRO -->
<div class="scene active" id="scene-intro">
  <div class="bg-image"></div>
  <div class="vignette"></div>
  <div class="content">
    <p class="intro-eyebrow">A cinematic birthday experience</p>
    <!-- ▼▼▼ ADD NAME e.g. Happy Birthday<br><em>Jane</em> ▼▼▼ -->
    <h1 class="intro-title">Happy Birthday</h1>
    <p class="intro-sub">Press Enter or click to begin</p>
    <button class="btn-start" onclick="startExperience()"><span>▶ &nbsp;Start</span></button>
  </div>
</div>

<!-- SCENE 2 — GLOBE -->
<div class="scene" id="scene-globe">
  <div id="globe-container">
    <div id="globe-stage"></div>
  </div>
  <div id="globe-dots"></div>
</div>

<!-- SCENE 3 — ENDING -->
<div class="scene" id="scene-ending">
  <canvas id="fireworks-canvas"></canvas>
  <div class="bg-ending"></div>
  <div class="message-card">
    <p class="card-eyebrow">With all the love in the world</p>
    <!-- ▼▼▼ ADD NAME ▼▼▼ -->
    <h2 class="card-title">Happy Birthday</h2>
    <div class="card-divider"></div>
    <!-- ▼▼▼ CHANGE MESSAGE ▼▼▼ -->
    <p class="card-message">I hope this year brings you happiness,<br>growth, and beautiful memories.</p>
    <p class="card-message">Have an amazing day 🎉</p>
    <span class="card-emoji">✨</span>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   CONFIG — replace images with your own
═══════════════════════════════════════ */
const CONFIG = {
  images: [
    /* ▼▼▼ REPLACE these Unsplash URLs with your own photo filenames
       e.g. 'photo1.jpg', 'photo2.jpg' etc. ▼▼▼ */
    'photo1.jpg',
    'photo2.jpg',
    'photo3.jpg',
    'phot4.jpg',
    'photo5.jpg',
    'photo6.jpg,
    'photo7.jpg',
    'photo8.jpg',
    'photo9.jpg',
  ],
  slideDuration:   5500,
  fadeOutDuration: 1300,
  musicVolume:     0.8,
};

/* ── MUSIC ── */
const music = document.getElementById('bg-music');
function playMusic() {
  music.volume = CONFIG.musicVolume;
  music.play().catch(() => { document.getElementById('music-btn').style.display='block'; });
}
function retryMusic() { music.play().catch(()=>{}); document.getElementById('music-btn').style.display='none'; }

/* ── PARTICLES ── */
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function rp() {
    const hue = Math.random()<0.6 ? 310+Math.random()*40 : 45+Math.random()*25;
    return { x:Math.random()*W, y:Math.random()*H, r:0.4+Math.random()*1.6,
      speedX:(Math.random()-0.5)*0.2, speedY:-(0.06+Math.random()*0.18),
      alpha:0.08+Math.random()*0.45, hue, phase:Math.random()*Math.PI*2 };
  }
  for(let i=0;i<150;i++) particles.push(rp());
  function tick() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.phase+=0.007; p.x+=p.speedX+Math.sin(p.phase)*0.15; p.y+=p.speedY;
      if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
      ctx.save();
      ctx.globalAlpha=p.alpha*(0.65+0.35*Math.sin(p.phase));
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.5);
      g.addColorStop(0,`hsla(${p.hue},100%,82%,1)`);
      g.addColorStop(1,`hsla(${p.hue},100%,82%,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ── SCENE SWITCH ── */
function showScene(id) {
  document.querySelectorAll('.scene').forEach(s => { s.classList.remove('active'); s.style.pointerEvents='none'; });
  const n = document.getElementById(id); n.classList.add('active'); n.style.pointerEvents='all';
}

/* ── START ── */
let started = false;
function startExperience() {
  if(started) return; started=true;
  playMusic();
  showScene('scene-globe');
  buildGlobe();
  runGlobe();
}
document.addEventListener('keydown', e => { if(e.key==='Enter') startExperience(); });

/* ══════════════════════════════════════════════════
   GLOBE — 3D sphere of photos, each rotating forward
══════════════════════════════════════════════════ */
const TOTAL = CONFIG.images.length;
let currentIndex = 0;
let globeCards = [];
let globeTimer = null;

function buildGlobe() {
  const stage = document.getElementById('globe-stage');
  const dotsEl = document.getElementById('globe-dots');
  stage.innerHTML = ''; dotsEl.innerHTML = '';

  CONFIG.images.forEach((src, i) => {
    // Create card
    const card = document.createElement('div');
    card.className = 'globe-card';
    card.id = `gcard-${i}`;
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    card.appendChild(img);
    stage.appendChild(card);
    globeCards.push(card);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.id = `dot-${i}`;
    dotsEl.appendChild(dot);
  });

  positionCards(0);
}

/*
  Globe layout:
  Cards are arranged in a circle on the Z axis.
  The active card is fully facing the viewer (translateZ forward).
  Others are rotated around Y axis evenly — like a carousel on a sphere.
*/
function positionCards(activeIdx) {
  const n = TOTAL;
  const radius = 0; // We animate position, not radius for cleaner look

  globeCards.forEach((card, i) => {
    const offset = i - activeIdx;
    // Wrap offset so cards don't all go one direction
    let wrappedOffset = offset;
    if(wrappedOffset > n/2) wrappedOffset -= n;
    if(wrappedOffset < -n/2) wrappedOffset += n;

    const angleY = wrappedOffset * (360 / n);
    const tz = wrappedOffset === 0 ? 0 : -300;
    const scale = wrappedOffset === 0 ? 1 : 0.55 - Math.abs(wrappedOffset)*0.05;
    const clampedScale = Math.max(0.25, scale);
    const opacity = wrappedOffset === 0 ? 1 : Math.max(0, 0.5 - Math.abs(wrappedOffset)*0.12);
    const zIndex = wrappedOffset === 0 ? 10 : 5 - Math.abs(wrappedOffset);

    card.style.transition = 'transform 1.1s cubic-bezier(0.16,1,0.3,1), opacity 1.1s ease';
    card.style.transform = `rotateY(${angleY}deg) translateZ(${wrappedOffset===0?200:tz}px) scale(${clampedScale})`;
    card.style.opacity = opacity;
    card.style.zIndex = zIndex;

    card.classList.remove('active','prev');
    if(wrappedOffset === 0) card.classList.add('active');
    if(wrappedOffset === -1 || (activeIdx===0 && i===n-1)) card.classList.add('prev');

    // dot
    const dot = document.getElementById(`dot-${i}`);
    if(dot) { dot.classList.toggle('active', i === activeIdx); }
  });
}

function runGlobe() {
  const bar = document.getElementById('progress-bar');
  bar.style.opacity = '1';

  function nextCard() {
    bar.style.transition = 'none'; bar.style.width='0%';
    requestAnimationFrame(() => {
      bar.style.transition = `width ${CONFIG.slideDuration}ms linear`;
      bar.style.width = '100%';
    });

    globeTimer = setTimeout(() => {
      if(currentIndex + 1 < TOTAL) {
        currentIndex++;
        positionCards(currentIndex);
        nextCard();
      } else {
        bar.style.opacity = '0';
        document.getElementById('globe-dots').style.opacity = '0';
        setTimeout(() => startEnding(), CONFIG.fadeOutDuration + 400);
      }
    }, CONFIG.slideDuration);
  }

  positionCards(0);
  nextCard();
}

/* ── FIREWORKS ENDING ── */
function startEnding() { showScene('scene-ending'); initFireworks(); }
function initFireworks() {
  const canvas=document.getElementById('fireworks-canvas'); const ctx=canvas.getContext('2d'); let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize); resize();
  const rockets=[],sparkles=[],COLORS=['#e040a0','#ff69c8','#f5d97a','#b0f0ff','#ff9cde','#fff0a8','#c8a0ff','#80ffee'];
  class Rocket{
    constructor(){this.reset();}
    reset(){this.x=0.15*W+Math.random()*0.7*W;this.y=H;this.vy=-(9+Math.random()*6);this.targetY=0.08*H+Math.random()*0.45*H;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];this.exploded=false;this.trail=[];}
    update(){this.trail.push({x:this.x,y:this.y});if(this.trail.length>14)this.trail.shift();this.y+=this.vy;this.vy*=0.98;if(this.y<=this.targetY&&!this.exploded)this.explode();}
    explode(){this.exploded=true;const c=90+Math.floor(Math.random()*60);for(let i=0;i<c;i++){const a=(i/c)*Math.PI*2,sp=1.5+Math.random()*4;sparkles.push(new Sparkle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,this.color));}}
    draw(){this.trail.forEach((t,i)=>{ctx.save();ctx.globalAlpha=(i/this.trail.length)*0.6;ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(t.x,t.y,1.5,0,Math.PI*2);ctx.fill();ctx.restore();});}
  }
  class Sparkle{
    constructor(x,y,vx,vy,color){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.alpha=1;this.r=1.5+Math.random()*2;}
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.06;this.vx*=0.985;this.alpha-=0.014;}
    draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.alpha);ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  }
  (function launchRocket(){rockets.push(new Rocket());setTimeout(launchRocket,650+Math.random()*650);})();
  function loop(){
    ctx.fillStyle='rgba(5,4,8,0.20)';ctx.fillRect(0,0,W,H);
    for(let i=rockets.length-1;i>=0;i--){rockets[i].update();rockets[i].draw();if(rockets[i].exploded)rockets.splice(i,1);}
    for(let i=sparkles.length-1;i>=0;i--){sparkles[i].update();sparkles[i].draw();if(sparkles[i].alpha<=0)sparkles.splice(i,1);}
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
