<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Faith Wahu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --magenta:      #e040a0;
  --magenta-glow: #ff69c8;
  --magenta-dim:  rgba(224,64,160,0.25);
  --deep:         #050408;
  --glass-bg:     rgba(12,8,20,0.55);
  --glass-border: rgba(224,64,160,0.35);
  --white:        #f0eaf8;
  --ff-display:   'Cormorant Garamond', serif;
  --ff-body:      'Jost', sans-serif;
}

html, body {
  width:100%; height:100%;
  background:var(--deep);
  color:var(--white);
  font-family:var(--ff-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── PARTICLES ── */
#particle-canvas { position:fixed; inset:0; z-index:5; pointer-events:none; }

/* ── SCENES ── */
.scene {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity 1.4s ease;
  z-index:10;
}
.scene.active { opacity:1; pointer-events:all; }

/* ══ SCENE 1 — INTRO ══ */
#scene-intro { flex-direction:column; background:var(--deep); z-index:10; }

#scene-intro .bg-image {
  position:absolute; inset:0;
  /* ▼ REPLACE with your fireworks image filename ▼ */
  background: url('fireworks-bg.jpg') center/cover no-repeat;
  opacity:0.30;
  filter:saturate(1.4) hue-rotate(-10deg);
}

#scene-intro .vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, var(--deep) 85%);
}

#scene-intro .content {
  position:relative; z-index:2;
  text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:1.4rem;
  animation:introReveal 2s ease forwards;
  animation-delay:0.3s; opacity:0;
}

@keyframes introReveal {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}

.intro-eyebrow {
  font-family:var(--ff-body); font-weight:200;
  font-size:clamp(0.65rem,2vw,0.85rem);
  letter-spacing:0.38em; text-transform:uppercase;
  color:var(--magenta-glow); opacity:0.9;
}
.intro-title {
  font-family:var(--ff-display); font-weight:300;
  font-size:clamp(2.8rem,10vw,7rem);
  line-height:1.05; color:var(--white);
  text-shadow:0 0 60px var(--magenta-dim), 0 0 120px rgba(224,64,160,.12);
}
.intro-title em {
  font-style:italic; color:var(--magenta-glow);
  text-shadow:0 0 30px rgba(255,105,200,.7), 0 0 80px rgba(255,105,200,.3);
}
.intro-sub {
  font-family:var(--ff-body); font-weight:200;
  font-size:clamp(0.7rem,2.2vw,0.95rem);
  letter-spacing:0.2em; text-transform:uppercase;
  opacity:0.5; margin-top:0.4rem;
}

.btn-start {
  margin-top:1.6rem; padding:0.85em 2.8em;
  background:transparent;
  border:1px solid var(--glass-border); border-radius:2px;
  color:var(--white); font-family:var(--ff-body); font-weight:300;
  font-size:clamp(0.7rem,2.2vw,0.88rem);
  letter-spacing:0.3em; text-transform:uppercase;
  cursor:pointer; position:relative; overflow:hidden;
  transition:border-color .4s, color .4s, box-shadow .4s;
}
.btn-start::before {
  content:''; position:absolute; inset:0;
  background:var(--magenta-dim);
  transform:scaleX(0); transform-origin:left;
  transition:transform .4s ease;
}
.btn-start:hover {
  border-color:var(--magenta-glow);
  color:var(--magenta-glow);
  box-shadow:0 0 20px var(--magenta-dim);
}
.btn-start:hover::before { transform:scaleX(1); }
.btn-start span { position:relative; z-index:1; }
.btn-start::after {
  content:''; position:absolute; inset:-4px;
  border:1px solid rgba(224,64,160,.2); border-radius:3px;
  animation:pulsRing 2.5s ease-in-out infinite;
}
@keyframes pulsRing {
  0%,100% { opacity:.15; transform:scale(1); }
  50%      { opacity:.6;  transform:scale(1.03); }
}

/* ══ SCENE 2 — SLIDESHOW ══ */
#scene-slideshow { background:#000; z-index:9; }

.slide-image {
  position:absolute; inset:0;
  background-size:contain;        /* full photo, no cropping */
  background-repeat:no-repeat;
  background-position:center center;
  opacity:0;
  transition:opacity 1.4s ease;
  /* NO blur effect — photos shown clean and sharp */
}

.slide-image.visible {
  opacity:1;
  animation:kenBurns 7s ease-in-out forwards;
}
@keyframes kenBurns {
  from { transform:scale(1); }
  to   { transform:scale(1.07); }
}
.slide-image.fading-out {
  opacity:0;
  transition:opacity 1.2s ease;
}

/* Cinematic vignette around edges */
#scene-slideshow::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);
  z-index:2; pointer-events:none;
}
/* Subtle magenta neon glow on edges */
#scene-slideshow::before {
  content:''; position:absolute; inset:0;
  box-shadow:inset 0 0 90px rgba(224,64,160,0.07);
  z-index:3; pointer-events:none;
}

/* ══ SCENE 3 — ENDING ══ */
#scene-ending { flex-direction:column; z-index:11; }
#fireworks-canvas { position:absolute; inset:0; z-index:0; }

#scene-ending .bg-ending {
  position:absolute; inset:0;
  /* ▼ REPLACE with your fireworks image filename ▼ */
  background: url('fireworks-bg.jpg') center/cover no-repeat;
  opacity:0.18;
  filter:saturate(1.6);
}

/* ══ FINAL MESSAGE CARD ══ */
.message-card {
  position:relative; z-index:3;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:4px;
  padding:clamp(2rem,6vw,3.5rem) clamp(1.8rem,7vw,4.5rem);
  max-width:min(680px,90vw);
  text-align:center;
  backdrop-filter:blur(22px) saturate(1.3);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:
    0 0 60px rgba(224,64,160,.25),
    0 0 120px rgba(224,64,160,.1),
    inset 0 0 40px rgba(224,64,160,.06);
  opacity:0; transform:scale(0.93);
  animation:cardEntrance 1.4s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:0.8s;
}
@keyframes cardEntrance {
  from { opacity:0; transform:scale(.93) translateY(20px); }
  to   { opacity:1; transform:scale(1)   translateY(0); }
}
.message-card::before, .message-card::after {
  content:''; position:absolute; top:15%; bottom:15%; width:1px;
  background:linear-gradient(to bottom, transparent, var(--magenta), transparent);
  opacity:0.5;
}
.message-card::before { left:0; }
.message-card::after  { right:0; }

.card-eyebrow {
  font-family:var(--ff-body); font-weight:200;
  font-size:clamp(.55rem,1.8vw,.72rem); letter-spacing:.42em;
  text-transform:uppercase; color:var(--magenta-glow);
  margin-bottom:1.4rem; opacity:.85;
}
.card-title {
  font-family:var(--ff-display); font-weight:300;
  font-size:clamp(2rem,6vw,3.8rem); line-height:1.1; color:var(--white);
  text-shadow:0 0 40px var(--magenta-dim); margin-bottom:1.6rem;
}
.card-title em { font-style:italic; color:var(--magenta-glow); }
.card-divider {
  width:60px; height:1px;
  background:linear-gradient(to right, transparent, var(--magenta), transparent);
  margin:0 auto 1.6rem;
}
.card-message {
  font-family:var(--ff-body); font-weight:200;
  font-size:clamp(.85rem,2.5vw,1.05rem); line-height:1.85;
  color:rgba(240,234,248,.78); letter-spacing:.03em; margin-bottom:.9rem;
}
.card-emoji {
  font-size:clamp(1.4rem,4vw,2rem); display:block; margin-top:.8rem;
  animation:floatEmoji 2.5s ease-in-out infinite;
}
@keyframes floatEmoji {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-6px); }
}

/* ── PROGRESS BAR ── */
#progress-bar {
  position:fixed; bottom:0; left:0;
  height:2px; width:0%;
  background:linear-gradient(to right, var(--magenta-dim), var(--magenta-glow), var(--magenta-dim));
  z-index:100; transition:width .25s linear;
  box-shadow:0 0 10px var(--magenta); opacity:0;
}

/* Subtle top neon line */
body::after {
  content:''; position:fixed; top:0; left:0; right:0; height:1px;
  background:linear-gradient(to right, transparent, var(--magenta-glow), transparent);
  opacity:0.35; z-index:999; pointer-events:none;
}

/* Music retry button — only shows if music fails to play */
#music-btn {
   display:block;
   position:fixed;
   top:20px;
   right:20px;
   z-index:9999;
  position:fixed; bottom:20px; right:20px;
  padding:0.5em 1.2em;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:20px;
  color:var(--magenta-glow);
  font-family:var(--ff-body); font-weight:300;
  font-size:0.75rem; letter-spacing:0.15em;
  cursor:pointer; z-index:200;
  backdrop-filter:blur(10px);
}
#music-btn:hover { border-color:var(--magenta-glow); }

@media(max-width:480px) {
  .intro-title { letter-spacing:.01em; }
  .message-card { padding:2rem 1.6rem; }
}
</style>
</head>
<body>

<!--
╔══════════════════════════════════════════════════════╗
║  MUSIC SETUP                                         ║

-->

<div style="text-align: center; margin: 20px 0; position: relative; z-index: 9999;">
    <audio id="bg-music" controls loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>



<canvas id="particle-canvas"></canvas>
<div id="progress-bar"></div>

<!-- ══ SCENE 1 — INTRO ══ -->
<div class="scene active" id="scene-intro">
  <div class="bg-image"></div>
  <div class="vignette"></div>
  <div class="content">
    <p class="intro-eyebrow">A cinematic birthday experience</p>

    <!-- ▼ REPLACE THE NAME BELOW ▼ -->
    <h1 class="intro-title">Happy Birthday<br><em>Faith Wahu</em></h1>
    <!-- ▲ REPLACE THE NAME ABOVE ▲ -->

    <p class="intro-sub">Press Enter or click to begin</p>
    <button class="btn-start" onclick="startExperience()">
      <span>▶ &nbsp;Start</span>
    </button>
  </div>
</div>

<!--
  ══ SCENE 2 — SLIDESHOW ══
  Photos must be in the SAME FOLDER as this HTML file.
  Named exactly:  photo1.jpg  photo2.jpg  ...  photo9.jpg
  No spaces in filenames.
-->
<div class="scene" id="scene-slideshow"></div>

<!-- ══ SCENE 3 — ENDING ══ -->
<div class="scene" id="scene-ending">
  <canvas id="fireworks-canvas"></canvas>
  <div class="bg-ending"></div>

  <div class="message-card">
    <p class="card-eyebrow">With all the love in the world</p>

    <!-- ▼ REPLACE THE NAME BELOW ▼ -->
    <h2 class="card-title">Happy Birthday<br><em>Faith Wahu</em></h2>
    <!-- ▲ REPLACE THE NAME ABOVE ▲ -->

    <div class="card-divider"></div>

    <!-- ▼ REPLACE THE MESSAGE BELOW ▼ -->
    <p class="card-message">
      I hope this year brings you happiness,<br>growth, and beautiful memories.
    </p>
    <p class="card-message">Have an amazing day 🎉</p>
    <!-- ▲ REPLACE THE MESSAGE ABOVE ▲ -->

    <span class="card-emoji">✨</span>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   CONFIG — edit only inside this block
═══════════════════════════════════════ */
const CONFIG = {
  images: [
    'photo1.jpg',
    'photo2.jpg',
    'photo3.jpg',
    'photo4.jpg',
    'photo5.jpg',
    'photo6.jpg',
    'photo7.jpg',
    'photo8.jpg',
    'photo9.jpg',
  ],
  slideDuration:   5500,  // ms each photo stays on screen
  fadeOutDuration: 1300,  // ms fade between photos
  musicVolume:     0.8,   // 0.0 silent → 1.0 full volume
};

/* ── MUSIC HELPERS ── */
const music = document.getElementById('bg-music');

function playMusic() {
  music.volume = CONFIG.musicVolume;
  const promise = music.play();
  if(promise !== undefined) {
    promise.catch(() => {
      // Browser blocked autoplay — show the retry button
      document.getElementById('music-btn').style.display = 'block';
    });
  }
}

function retryMusic() {
  music.play().catch(() => {});
  document.getElementById('music-btn').style.display = 'none';
}

/* ── PARTICLES ── */
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function rp() {
    const hue = Math.random() < 0.6 ? 310 + Math.random()*40 : 45 + Math.random()*25;
    return {
      x: Math.random()*W, y: Math.random()*H,
      r: 0.5 + Math.random()*1.8,
      speedX: (Math.random()-0.5)*0.25,
      speedY: -(0.08 + Math.random()*0.22),
      alpha: 0.1 + Math.random()*0.55,
      hue, phase: Math.random()*Math.PI*2,
    };
  }

  for(let i=0; i<130; i++) particles.push(rp());

  function tick() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.phase += 0.008;
      p.x += p.speedX + Math.sin(p.phase)*0.18;
      p.y += p.speedY;
      if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
      ctx.save();
      ctx.globalAlpha = p.alpha * (0.7 + 0.3*Math.sin(p.phase));
      const g = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y,p.r*3);
      g.addColorStop(0, `hsla(${p.hue},100%,80%,1)`);
      g.addColorStop(1, `hsla(${p.hue},100%,80%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ── SCENE SWITCH ── */
function showScene(id) {
  document.querySelectorAll('.scene').forEach(s => {
    s.classList.remove('active');
    s.style.pointerEvents = 'none';
  });
  const n = document.getElementById(id);
  n.classList.add('active');
  n.style.pointerEvents = 'all';
}

/* ── START ── */
let started = false;
function startExperience() {
  if(started) return;
  started = true;
  playMusic();
  showScene('scene-slideshow');
  buildSlideshow();
  runSlideshow();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') startExperience();
});

/* ── SLIDESHOW ── */
function buildSlideshow() {
  const container = document.getElementById('scene-slideshow');
  CONFIG.images.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'slide-image';
    div.id = `slide-${i}`;
    div.style.backgroundImage = `url('${src}')`;
    container.appendChild(div);
  });
}

function runSlideshow() {
  const total = CONFIG.images.length;
  const bar   = document.getElementById('progress-bar');
  bar.style.opacity = '1';

  function showSlide(index) {
    const slide = document.getElementById(`slide-${index}`);
    slide.classList.add('visible');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    requestAnimationFrame(() => {
      bar.style.transition = `width ${CONFIG.slideDuration}ms linear`;
      bar.style.width = '100%';
    });
    setTimeout(() => {
      slide.classList.remove('visible');
      slide.classList.add('fading-out');
      setTimeout(() => {
        slide.classList.remove('fading-out');
        if(index + 1 < total) showSlide(index + 1);
        else { bar.style.opacity = '0'; startEnding(); }
      }, CONFIG.fadeOutDuration);
    }, CONFIG.slideDuration);
  }
  showSlide(0);
}

/* ── FIREWORKS ── */
function startEnding() {
  showScene('scene-ending');
  initFireworks();
}

function initFireworks() {
  const canvas = document.getElementById('fireworks-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  const rockets  = [];
  const sparkles = [];
  const COLORS   = ['#e040a0','#ff69c8','#f5d97a','#b0f0ff','#ff9cde','#fff0a8','#c8a0ff','#80ffee'];

  class Rocket {
    constructor(){ this.reset(); }
    reset(){
      this.x        = 0.15*W + Math.random()*0.7*W;
      this.y        = H;
      this.vy       = -(9 + Math.random()*6);
      this.targetY  = 0.08*H + Math.random()*0.45*H;
      this.color    = COLORS[Math.floor(Math.random()*COLORS.length)];
      this.exploded = false;
      this.trail    = [];
    }
    update(){
      this.trail.push({ x:this.x, y:this.y });
      if(this.trail.length > 14) this.trail.shift();
      this.y  += this.vy;
      this.vy *= 0.98;
      if(this.y <= this.targetY && !this.exploded) this.explode();
    }
    explode(){
      this.exploded = true;
      const c = 90 + Math.floor(Math.random()*60);
      for(let i=0; i<c; i++){
        const a  = (i/c)*Math.PI*2;
        const sp = 1.5 + Math.random()*4;
        sparkles.push(new Sparkle(this.x, this.y, Math.cos(a)*sp, Math.sin(a)*sp, this.color));
      }
    }
    draw(){
      this.trail.forEach((t,i) => {
        ctx.save();
        ctx.globalAlpha = (i/this.trail.length)*0.6;
        ctx.fillStyle   = this.color;
        ctx.shadowColor = this.color; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(t.x,t.y,1.5,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    }
  }

  class Sparkle {
    constructor(x,y,vx,vy,color){
      this.x=x; this.y=y; this.vx=vx; this.vy=vy;
      this.color=color; this.alpha=1; this.r=1.5+Math.random()*2;
    }
    update(){
      this.x  += this.vx; this.y  += this.vy;
      this.vy += 0.06;    this.vx *= 0.985;
      this.alpha -= 0.014;
    }
    draw(){
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle   = this.color;
      ctx.shadowColor = this.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  (function launchRocket(){
    rockets.push(new Rocket());
    setTimeout(launchRocket, 650 + Math.random()*650);
  })();

  function loop(){
    ctx.fillStyle = 'rgba(5,4,8,0.20)';
    ctx.fillRect(0,0,W,H);
    for(let i=rockets.length-1; i>=0; i--){
      rockets[i].update(); rockets[i].draw();
      if(rockets[i].exploded) rockets.splice(i,1);
    }
    for(let i=sparkles.length-1; i>=0; i--){
      sparkles[i].update(); sparkles[i].draw();
      if(sparkles[i].alpha <= 0) sparkles.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
